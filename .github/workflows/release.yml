name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (win-x64 AOT)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        run: |
          dotnet publish src/AvaloniaProject/AvaloniaProject.csproj `
            -c Release `
            -r win-x64 `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish/win-x64

      - name: Cleanup publish output
        run: |
          Get-ChildItem -Path publish/win-x64 -Filter *.pdb -Recurse -File | Remove-Item -Force

      - name: Zip output
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath AvaloniaProject-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvaloniaProject-win-x64
          path: publish/win-x64/**
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AvaloniaProject-win-x64.zip
